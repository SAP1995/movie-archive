<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5fae">
<meta name="description" content="View your Movie Archive (.mvx) on your phone. The file is read on this device only.">
<title>Movie Archive</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Start -->
<section id="start" class="start">
  <div class="start-box">
    <img src="icons/icon-192.png" alt="" class="start-logo">
    <h1>Movie Archive</h1>
    <p class="muted">Your movie &amp; series collection, on your phone.</p>
    <div id="keptBox" class="kept" hidden>
      <button id="keptOpen" class="btn primary big"></button>
      <button id="keptForget" class="btn link">Forget this archive</button>
    </div>
    <label class="btn primary big" id="pickLabel"><input type="file" id="pick" hidden>Open archive file (.mvx)</label>
    <p id="startMsg" class="msg" role="alert"></p>
    <p class="note">The file is read on this device only. Nothing is uploaded.</p>
  </div>
  <div class="start-foot muted" id="ver"></div>
</section>

<!-- Loading -->
<section id="loading" class="loading" hidden>
  <img src="icons/icon-192.png" alt="" class="start-logo">
  <div class="bar"><i></i></div>
  <p id="loadMsg" class="muted">Opening…</p>
</section>

<!-- Main -->
<section id="main" class="main" hidden>
  <header class="top">
    <div class="top-row">
      <div class="top-title" id="archName" dir="auto"></div>
      <button class="icon-btn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
    </div>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input type="search" id="q" placeholder="Search titles, people…" dir="auto" autocomplete="off" spellcheck="false"><button id="qClear" class="clear" hidden aria-label="Clear">✕</button></div>
    <nav class="tabs"><button data-tab="titles" class="on">Titles</button><button data-tab="cast">Cast</button></nav>
  </header>
  <div class="tools" id="tools"></div>
  <div class="list" id="list"></div>
</section>

<div id="layers"></div>
<div id="toast" class="toast" hidden></div>

<script src="reader.js"></script>
<script src="app.js"></script>
</body>
</html>
